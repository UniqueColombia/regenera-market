name: Dependencias

# Vigila las dependencias de producción sin abrir PR ni mandar correo de
# Dependabot (la entrega es directa, ver la skill entrega-directa). Falla —y
# GitHub avisa— solo si aparece una vulnerabilidad alta o crítica.
on:
  push:
    branches: [main, staging]
    paths: [package.json, package-lock.json]
  schedule:
    - cron: "0 12 * * 1" # los lunes
  workflow_dispatch:

# Solo lectura: ningún job escribe en el repositorio. Si una acción o una
# dependencia se ve comprometida, el token no le sirve para nada más
# (auditoría del 2026-10-22).
permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (solo producción)
        run: npm audit --omit=dev --audit-level=high
