name: Latido

# ---------------------------------------------------------------------------
# El monitor de producción: una vez al día, desde fuera, pregunta a
# https://seregenera.com/api/latido si está viva.
#
# Ese endpoint consulta la base (MariaDB de Hostinger desde el 2026-10-17) y,
# desde el 2026-10-20, revisa también la configuración de producción: si falta
# algo crítico —sobre todo `BASE_DE_DATOS=mysql`, cuya pérdida haría volver la
# app a Supabase en silencio— responde 503 aunque la base conteste. Qué falta lo
# dice el registro del servidor, no la respuesta (es pública).
#
# Si el job se pone rojo, GitHub manda el correo. Es el único aviso automático
# que hay de que producción se cayó o se desconfiguró.
#
# Hasta el 2026-10-20 apuntaba al Vercel de respaldo y servía además para que
# Supabase no pausara el proyecto por inactividad. Con producción en Hostinger y
# Supabase camino de pausarse, eso dejó de tener sentido.
#
# ⚠️ **GitHub desactiva los `schedule` de un repositorio tras 60 días sin
# actividad** y avisa por correo antes de hacerlo. Si el proyecto se queda
# quieto dos meses, hay que volver a activarlo a mano en la pestaña Actions —
# si no, el latido se para justo cuando más falta hace.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 12:10 UTC = 07:10 en Colombia. Minuto 10 y no en punto a propósito: GitHub
    # encola los cron de todo el mundo a las horas redondas y los retrasa.
    - cron: "10 12 * * *"
  # Para poder probarlo sin esperar a mañana.
  workflow_dispatch:

concurrency:
  group: latido
  cancel-in-progress: false

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SITIO: https://seregenera.com

    steps:
      - name: Preguntar a producción si está viva y bien configurada
        run: |
          set -uo pipefail
          echo "→ GET $SITIO/api/latido"
          codigo=$(curl -sS -o /tmp/respuesta -w "%{http_code}" \
                    --max-time 45 --retry 3 --retry-delay 20 --retry-all-errors \
                    "$SITIO/api/latido" || echo "000")
          echo "   HTTP $codigo"
          head -c 300 /tmp/respuesta; echo

          if [ "$codigo" = "200" ] && grep -q '"ok":true' /tmp/respuesta; then
            echo "✅ Producción responde y la base contesta."
            exit 0
          fi

          case "$codigo" in
            503)
              if grep -q '"configuracion"' /tmp/respuesta; then
                echo "::error::Producción está mal configurada (falta una variable crítica). El registro del servidor dice cuál: hPanel → seregenera.com → registros, líneas [configuracion] o [latido]."
              else
                echo "::error::La base no respondió (503). Revisa el MariaDB de Hostinger y las MYSQL_* de la app."
              fi ;;
            000) echo "::error::El sitio no contestó. ¿Está caído el Node.js de Hostinger o falló el último build?" ;;
            *)   echo "::error::/api/latido respondió $codigo." ;;
          esac
          exit 1
