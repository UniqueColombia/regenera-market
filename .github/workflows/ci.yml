name: CI

on:
  # Sin filtro de rama a propósito: así el CI también corre en PRs apilados
  # (base = otra rama de trabajo). Con `branches: [main, staging]` un PR apilado
  # se mergea sin haber pasado por CI nunca.
  pull_request:
  push:
    branches: [main, staging]

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Debe coincidir con la versión de Node del proyecto en Vercel. Si no
          # coinciden, el CI pasa en verde y producción falla.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El build va PRIMERO: genera los tipos de rutas (PageProps,
      # LayoutProps) que tsc necesita. En un clon limpio, `tsc --noEmit` sin
      # build previo falla con TS2304 en cada page.tsx.
      #
      # Corre sin credenciales a propósito: si el build necesita un secreto para
      # compilar, la app dejó de ser clonable y navegable sin configurar nada.
      # Ver la skill nueva-integracion.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Pruebas de las reglas de src/lib
        run: npm test

  # Las migraciones y las funciones de Postgres, contra un Postgres 17 de
  # verdad que levanta `supabase/pruebas/preparar-base.ts` (embedded-postgres,
  # sin Docker ni credenciales). Aparte de `verificar` porque no necesita el
  # build y así corren a la vez.
  #
  # Si falla «La migración NNNN no corre sobre Postgres + supabase-minimo.sql»,
  # la migración usa algo de Supabase que el shim no tiene: ver
  # docs/PORTABILIDAD.md antes de agregarlo.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de la base
        run: npm run test:base

  # El modo MySQL —lo que corre en producción desde el 2026-10-17— contra un
  # MariaDB 11.8 vacío (la versión de Hostinger) que levanta el propio job.
  # `mysql/pruebas/preparar.ts` crea las tablas y la lógica; las pruebas crean
  # sus datos. La clave es de un contenedor que muere con el job: no es un secreto.
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: raiz-del-ci
          MARIADB_DATABASE: pruebas
          MARIADB_USER: pruebas
          MARIADB_PASSWORD: pruebas-del-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: pruebas
      MYSQL_USER: pruebas
      MYSQL_PASSWORD: pruebas-del-ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del modo MySQL
        run: npm run test:mysql

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Ningún .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env'; then
            echo "::error::Hay un archivo .env versionado. Ningún .env entra al repo."
            exit 1
          fi

      - name: Ninguna clave de servicio en el código
        run: |
          if git grep -nIE 'NEXT_PUBLIC_[A-Z_]*(SERVICE_ROLE|PRIVATE|SECRET)' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Un secreto con prefijo NEXT_PUBLIC_ queda expuesto en el bundle del navegador."
            exit 1
          fi
